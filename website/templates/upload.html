<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* The Spinner Container */
    .loader-container {
      display: none;
      text-align: center;
      padding: 20px;
    }

    /* The Spinning Shape */
    .spinner {
      margin: 0 auto;
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    /* Rotation Animation */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #555;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="nav">
  <h2>MedReport Verifier</h2>
  <ul class="nav-links">
    <li><a href="{{ url_for('views.index') }}">Home</a></li>
    <li><a href="{{ url_for('views.student_dashboard') }}">Dashboard</a></li>
    <li><a href="{{ url_for('auth.logout') }}">Logout</a></li>
  </ul>
</div>

<div class="container">
  <div class="box">
    <h1>Upload Medical Report</h1>
    <form id="upload-form" method="POST" enctype="multipart/form-data">
      <label>Lecturer Code</label>
      <input type="text" name="teacher_id" required>

      <label>Student Name</label>
      <input type="text" name="student_name" required>

      <label>Subject</label>
      <input type="text" name="subject" required>

      <label>Issue Date</label>
      <input type="date" name="issue_date" required>

      <label>Medical Report File</label>
      <input type="file" name="file" accept="image/*" required>

      <button type="submit" id="upload-btn" class="button">Upload & Verify</button>

      <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <p class="loading-text">Almost done! Finalizing verification...</p>
      </div>
    </form>
  </div>
</div>

<div class="footer">
  <p>Medical Report Verifier Project 2025</p>
</div>

<script>
  const uploadForm = document.getElementById('upload-form');
  const uploadBtn = document.getElementById('upload-btn');
  const loader = document.getElementById('loader');

  uploadForm.addEventListener('submit', function() {
    uploadBtn.style.display = 'none'; 
    loader.style.display = 'block';   
  });
</script>

</body>
</html>
