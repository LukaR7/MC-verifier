<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lecturer Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="nav">
  <h2>MedReport Verifier</h2>
  <ul class="nav-links">
    <li><a href="{{ url_for('views.index') }}">Home</a></li>
    <li><a href="{{ url_for('auth.login_lec') }}">Login</a></li>
  </ul>
</div>

<div class="container">
  <div class="box">
    <h1>Lecturer Sign Up</h1>
    <p>Register as a faculty member.</p>

    <form method="POST">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Lecturer Code</label>
      <input type="text" name="lecturer_code" required>

      <label>Email</label>
      <input type="email" name="email" id="email" required>

      <label>Username</label>
      <input type="text" name="username" required>

      <label>Password</label>
      <input type="password" name="password" id="password" required>

      <p id="password-warning" style="color: #ff4d4d; font-size: 0.85rem; margin-top: 5px; display: none;">
        Enter a valid email and a password with at least 7 characters, uppercase, lowercase, and a number.
      </p>

      <button type="submit" class="button" id="signup-btn" disabled style="opacity: 0.5; cursor: not-allowed;">
        Register
      </button>
    </form>

    <p class="text-small">
      Already registered?
      <a href="{{ url_for('auth.login_lec') }}">Login here</a>
    </p>
  </div>
</div>

<div class="footer">
  <p>Medical Report Verifier Project 2025</p>
</div>

<script>
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const warningText = document.getElementById("password-warning");
  const signupBtn = document.getElementById("signup-btn");

  function validate() {
    const emailValue = emailInput.value;
    const passValue = passwordInput.value;
    const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue);
    const isPassValid = /[A-Z]/.test(passValue) && /[a-z]/.test(passValue) && /[0-9]/.test(passValue) && passValue.length >= 7;

    if ((emailValue.length > 0 || passValue.length > 0) && (!isEmailValid || !isPassValid)) {
      warningText.style.display = "block";
      signupBtn.disabled = true;
      signupBtn.style.opacity = "0.5";
    } else if (isEmailValid && isPassValid) {
      warningText.style.display = "none";
      signupBtn.disabled = false;
      signupBtn.style.opacity = "1";
      signupBtn.style.cursor = "pointer";
    } else {
      warningText.style.display = "none";
      signupBtn.disabled = true;
    }
  }

  emailInput.addEventListener("input", validate);
  passwordInput.addEventListener("input", validate);
</script>

</body>
</html>
