<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lecturer Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="nav">
  <h2>MedReport Verifier</h2>
  <ul class="nav-links">
    <li><a href="{{ url_for('views.index') }}">Home</a></li>
    <li><a href="{{ url_for('auth.login_lec') }}">Lecturer Login</a></li>
  </ul>
</div>

<div class="container">
  <div class="box">
    <h1>Lecturer Sign Up</h1>
    <p>Register as a faculty member.</p>

    <form method="POST">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="Lecturer Full Name" required>

      <label>Email</label>
      <input type="email" name="email" placeholder="email@example.com" required>


      <label>Password</label>
      <input type="password" name="password" id="password" placeholder="Create a password" required>

      <p id="password-warning" style="color: #ff4d4d; font-size: 0.85rem; margin-top: 5px; display: none;">
        Password must be at least 7 characters and include uppercase, lowercase, and a number.
      </p>

      <button type="submit" class="button" id="signup-btn" disabled style="opacity: 0.5; cursor: not-allowed;">
        Register as Lecturer
      </button>
    </form>

    <p class="text-small">
      Already registered?
      <a href="{{ url_for('auth.login_lec') }}">Login here</a>
    </p>
  </div>
</div>

<script>
  const passwordInput = document.getElementById("password");
  const warningText = document.getElementById("password-warning");
  const signupBtn = document.getElementById("signup-btn");

  passwordInput.addEventListener("input", function () {
    const value = passwordInput.value;

    if (value.length === 0) {
      warningText.style.display = "none";
      signupBtn.disabled = true;
      signupBtn.style.opacity = "0.5";
      return;
    }

    const hasUppercase = /[A-Z]/.test(value);
    const hasLowercase = /[a-z]/.test(value);
    const hasNumber = /[0-9]/.test(value);
    const isLongEnough = value.length >= 7;

    if (hasUppercase && hasLowercase && hasNumber && isLongEnough) {
      warningText.style.display = "none";
      signupBtn.disabled = false;
      signupBtn.style.opacity = "1";
      signupBtn.style.cursor = "pointer";
    } else {
      warningText.style.display = "block";
      signupBtn.disabled = true;
      signupBtn.style.opacity = "0.5";
      signupBtn.style.cursor = "not-allowed";
    }
  });
</script>

</body>
</html>
