<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lecturer Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .system-flag { border: 2px solid #dc3545 !important; color: #dc3545 !important; font-weight: bold; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand mb-0 h1">MedReport Verifier</span>
    <div class="nav-links">
        <a href="{{ url_for('views.index') }}" class="btn btn-outline-light btn-sm me-2">Home</a>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4" style="max-width: 1200px;">
    <h1>Lecturer Dashboard</h1>
    <p class="text-muted">Your Lecturer Code: <strong class="text-primary">{{ user.lecturer_code }}</strong></p>

    <div class="card p-3 shadow-sm mt-3">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Student</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>OCR Detection / Manual Feedback</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for record in records %}
                <tr>
                    <td>{{ record.student_name }}</td>
                    <td>{{ record.issue_date }}</td>
                    <td>
                        <span class="badge {% if record.status == 'Flagged' %}bg-danger{% elif record.status == 'Approved' %}bg-success{% else %}bg-warning text-dark{% endif %}">
                            {{ record.status }}
                        </span>
                    </td>
                    <form action="{{ url_for('views.update_status', record_id=record.id) }}" method="POST">
                        <td>
                            <input type="text" name="comment" value="{{ record.comment }}" 
                                   class="form-control form-control-sm {% if 'SYSTEM_FLAG' in record.comment %}system-flag{% endif %}" 
                                   placeholder="Add feedback...">
                        </td>
                        <td class="text-center">
                            <div class="d-flex gap-2 justify-content-center">
                                <select name="status" class="form-select form-select-sm" style="width: auto;">
                                    <option value="Pending" {% if record.status == 'Pending' %}selected{% endif %}>Pending</option>
                                    <option value="Approved" {% if record.status == 'Approved' %}selected{% endif %}>Approve</option>
                                    <option value="Rejected" {% if record.status == 'Rejected' %}selected{% endif %}>Reject</option>
                                    <option value="Flagged" {% if record.status == 'Flagged' %}selected{% endif %}>Flagged</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-success">Save</button>
                                <a href="{{ url_for('static', filename='uploads/' + record.file_name) }}" target="_blank" class="btn btn-sm btn-outline-primary">View MC</a>
                            </div>
                        </td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
